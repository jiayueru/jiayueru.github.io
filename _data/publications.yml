main:

  - title: "Q-Learning With World Models"
    authors: Perry Dong*, <strong>Yueru Jia*</strong>, Chelsea Finn, Dorsa Sadigh
    conference_short: arXiv 2026
    conference: arXiv Preprint, 2026.
    pdf: https://arxiv.org/pdf/2608.17163
    page: https://pd-perry.github.io/qwm/
    image: ./assets/img/qwm_teaser.png
    image_width: 2403
    image_height: 902
    highlights_source: https://arxiv.org/pdf/2608.17163v1
    # Evidence: Sections 4.1–4.4 and 5.1–5.3; Figures 4–7.
    highlights:
      - "World-model tree search combines intermediate Q-values and imagined future returns for better action selection."
      - "Search guides online collection and evaluation; the policy and critic train only on real transitions."
      - "Improves sample efficiency on Robomimic and LIBERO, with implementations on both EXPO and RLPD."
    notes: Co-First Author

  - title: "Video2Act: A Dual-System Video Diffusion Policy with Robotic Spatio-Motional Modeling"
    authors: <strong>Yueru Jia*</strong>, Jiaming Liu*, Shengbang Liu*, Rui Zhou, Wanhe Yu, Yuyang Yan, Xiaowei Chi, Yandong Guo, Boxin Shi, Shanghang Zhang
    conference_short: arXiv 2025
    conference: arXiv Preprint, 2025.
    pdf: https://arxiv.org/pdf/2512.03044
    page: https://video2act.github.io/
    code: https://github.com/jiayueru/Video2Act
    github: https://github.com/jiayueru/Video2Act
    image: ./assets/img/video2act_pipeline.png
    image_width: 1600
    image_height: 682
    highlights_source: https://arxiv.org/pdf/2512.03044v3
    # Evidence: Sections 3.3–3.4 and 4.1–4.4; Figure 3 and Table 1.
    highlights:
      - "Sobel spatial filters and temporal FFT extract interaction-relevant structure and motion from video diffusion features."
      - "A slow VDM guides a fast DiT action expert asynchronously, supporting stable control between perception updates."
      - "Improves real-world manipulation and generalizes to unseen objects, backgrounds, and lighting conditions."
    notes: Co-First Author

  - title: "TACO: TActile World Model as a Self-COrrector for Scalable Robot Policy Post-Training"
    authors: Shengbang Liu*, <strong>Yueru Jia*</strong>, Yuyang Yan*, Jiaming Liu*, Xinran Zhang*, Qiuxuan Feng, Yandong Guo, Shiji Zhou, Boxin Shi, Shanghang Zhang
    conference_short: arXiv 2026
    conference: arXiv Preprint, 2026.
    pdf: https://arxiv.org/pdf/2607.02840
    page: https://taco-wm.github.io/
    image: ./assets/img/taco_teaser_left.png
    image_width: 656
    image_height: 282
    highlights_source: https://arxiv.org/pdf/2607.02840v2
    # Evidence: Sections III-A–III-C and IV-A–IV-B; Table I. Task score credits partial completion.
    highlights:
      - "A compositional tactile world model jointly predicts video and force–torque signals to imagine contact-consistent corrections."
      - "Recognize–Imagine–Label localizes failures, generates corrections, and selects them by feasibility and predicted progress."
      - "Knowledge-insulated CFG-RL keeps the VLM fixed; mean task score rises from 0.375 to 0.825 after two iterations."
    notes: Co-First Author

  - title: "HarmoWAM: Harmonizing Generalizable and Precise Manipulation via Adaptive World Action Models"
    authors: Qiuxuan Feng*, Jiale Yu*, Jiaming Liu*, <strong>Yueru Jia*</strong>, Zhuangzhe Wu, Hao Chen, Zezhong Qian, Shuo Gu, Peng Jia, Siwei Ma, Shanghang Zhang
    conference_short: arXiv 2026
    conference: arXiv Preprint, 2026.
    pdf: https://arxiv.org/pdf/2605.10942
    page: https://elbb-yu.github.io/HarmoWAM/
    image: ./assets/img/harmowam_teaser.png
    image_width: 1938
    image_height: 839
    highlights_source: https://arxiv.org/pdf/2605.10942v1
    # Evidence: Sections 3.2–3.4 and 4.2–4.3; Figure 2 and Tables 2–3.
    highlights:
      - "Combines explicit video prediction for generalizable transit with latent dynamics for precise interaction."
      - "Process-adaptive gating switches between reactive and predictive experts according to the current task stage."
      - "Six real-world tasks demonstrate generalization to unseen backgrounds, object positions, and object instances."

  - title: "Lift3D Foundation Policy: Lifting 2D Large-Scale Pretrained Models for Robust 3D Robotic Manipulation"
    authors: <strong>Yueru Jia*</strong>, Jiaming Liu*, Sixiang Chen*, Chenyang Gu, Zhilue Wang, Longzan Luo, Lily Lee, Pengwei Wang, Renrui Zhang, Zhongyuan Wang, Shanghang Zhang
    conference_short: CVPR 2025
    conference: IEEE Conference on Computer Vision and Pattern Recognition (CVPR), 2025.
    pdf: https://arxiv.org/abs/2411.18623
    page: https://lift3d-web.github.io/
    code: https://github.com/PKU-HMI-Lab/LIFT3D.git
    image: ./assets/img/lift3d_teaser.png
    image_width: 1864
    image_height: 776
    highlights_source: https://arxiv.org/pdf/2411.18623v2
    # Evidence: Sections 3.2–3.3 and 4.1–4.4; Figure 2.
    highlights:
      - "Affordance-guided masking and depth reconstruction build implicit 3D awareness in pretrained 2D foundation models."
      - "Reuses 2D positional embeddings to encode point clouds directly, preserving explicit 3D geometry."
      - "Evaluated on Meta-World, Adroit, RLBench, and ten real-world tasks using 30 demonstrations per real-world task."
    github: "https://github.com/PKU-HMI-Lab/LIFT3D"
    notes: Co-First Author

  - title: "DesignEdit: Unify Spatial-Aware Image Editing via Training-free Inpainting with a Multi-Layered Latent Diffusion Framework"
    authors: <strong>Yueru Jia</strong>, Aosong Cheng, Yuhui Yuan, Chuke Wang, Ji Li, Huizhu Jia, Shanghang Zhang
    conference_short: AAAI 2025
    conference: The 39th AAAI Conference on Artificial Intelligence (AAAI-25), 2025.
    pdf: https://arxiv.org/abs/2403.14487
    code: https://github.com/design-edit/DesignEdit
    page: https://design-edit.github.io/
    image: ./assets/img/design_teaser.png
    image_width: 1520
    image_height: 578
    highlights_source: https://ojs.aaai.org/index.php/AAAI/article/download/32414/34569
    # Evidence: AAAI-25 published paper, pp. 3958–3962; Method and Applications.
    highlights:
      - "Training-free key-masked self-attention and artifact suppression inpaint backgrounds while removing unwanted objects."
      - "Decomposes images into latent layers, then fuses them by target layout in one diffusion denoising process."
      - "Supports complex multi-object edits, including occlusion-aware editing, camera panning, zooming out, and cross-image composition."
    github: "https://github.com/design-edit/DesignEdit"
    notes: First Author

  - title: "WoW: Towards a World-omniscient World-model Through Embodied Interaction"
    authors: Xiaowei Chi, Peidong Jia, Chun-Kai Fan, Xiaozhu Ju, Weishi Mi, Zhiyuan Qin, Kevin Zhang, Wanxin Tian, Kuangzhi Ge, Hao Li, Zezhong Qian, Anthony Chen, Qiang Zhou, <strong>Yueru Jia</strong>, etc.
    conference_short: arXiv 2025
    conference: arXiv Preprint, 2025.
    pdf: https://wow-world-model.github.io/
    page: https://wow-world-model.github.io/
    code: https://github.com/wow-world-model/wow-world-model
    image: ./assets/img/wow_teaser.png
    image_width: 1858
    image_height: 1010
    highlights_source: https://arxiv.org/pdf/2509.22642v2
    # Evidence: Sections 4.1–4.3 and 5; Figures 6–9.
    highlights:
      - "Trains a 14B video world model on 2M robot trajectories, with DINO-based feature alignment."
      - "SOPHIA uses VLM critics to refine prompts; a flow-mask inverse dynamics model converts predicted transitions into actions."
      - "Introduces WoWBench to evaluate physical consistency, planning, instruction following, and video quality."
    github: https://github.com/wow-world-model/wow-world-model

  - title: "RwoR: Generating Robot Demonstrations from Human Hand Collection for Policy Learning without Robot"
    authors: Liang Heng, Xiaoqi Li, Shangqing Mao, Jiaming Liu, Ruolin Liu, Jingli Wei, Yu-Kai Wang, <strong>Yueru Jia</strong>, Chenyang Gu, Rui Zhao, Shanghang Zhang, Hao Dong
    conference_short: IROS 2025
    conference: IEEE/RSJ International Conference on Intelligent Robots and Systems (IROS), 2025.
    pdf: https://arxiv.org/abs/2507.03930
    image: ./assets/img/rwor_teaser.jpg
    image_width: 1806
    image_height: 876
    highlights_source: https://arxiv.org/pdf/2507.03930v2
    # Evidence: Sections III-A–III-C and IV; Figure 2 and Table I.
    highlights:
      - "Collects human-hand demonstrations without a robot, then extracts gripper actions from wrist-camera trajectories."
      - "Aligns paired human/UMI demonstrations to train diffusion-based hand-to-gripper translation, bridging the visual embodiment gap."
      - "Policies trained on generated demonstrations perform comparably to UMI-collected data on the evaluated manipulation tasks."
