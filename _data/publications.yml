main:

  - title: "Q-Learning With World Models"
    authors: Perry Dong*, <strong>Yueru Jia*</strong>, Chelsea Finn, Dorsa Sadigh
    conference_short: arXiv 2026
    conference: arXiv Preprint, 2026.
    pdf: https://arxiv.org/pdf/2608.17163
    page: https://pd-perry.github.io/qwm/
    image: ./assets/img/qwm_teaser.png
    highlights_source: https://pd-perry.github.io/qwm/
