      - "Policy and critic learn only from real environment experience."
    notes: Co-First Author

  - title: "Video2Act: A Dual-System Video Diffusion Policy with Robotic Spatio-Motional Modeling"
    authors: <strong>Yueru Jia*</strong>, Jiaming Liu*, Shengbang Liu*, Rui Zhou, Wanhe Yu, Yuyang Yan, Xiaowei Chi, Yandong Guo, Boxin Shi, Shanghang Zhang
    conference_short: arXiv 2025
