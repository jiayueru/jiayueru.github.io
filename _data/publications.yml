    page: https://video2act.github.io/
    code: https://github.com/jiayueru/Video2Act
    github: https://github.com/jiayueru/Video2Act
    image: ./assets/img/video2act_pipeline.png
    highlights_source: https://arxiv.org/abs/2512.03044
    highlights:
      - "Extracts object boundaries and motion cues from video diffusion models."
      - "Pairs slow video understanding with a fast action policy."
      - "Enables stable manipulation with infrequent video-model updates."
    notes: Co-First Author

  - title: "TACO: TActile World Model as a Self-COrrector for Scalable Robot Policy Post-Training"
    authors: Shengbang Liu*, <strong>Yueru Jia*</strong>, Yuyang Yan*, Jiaming Liu*, Xinran Zhang*, Qiuxuan Feng, Yandong Guo, Shiji Zhou, Boxin Shi, Shanghang Zhang
