    image: ./assets/img/taco_teaser_left.png
    highlights_source: https://arxiv.org/abs/2607.02840v2
    highlights:
      - "Recognizes contact failures and imagines joint visual–tactile corrections."
      - "Labels corrective actions for iterative robot policy post-training."
      - "Average task score: 0.375 → 0.825 after two iterations."
    notes: Co-First Author

  - title: "HarmoWAM: Harmonizing Generalizable and Precise Manipulation via Adaptive World Action Models"
